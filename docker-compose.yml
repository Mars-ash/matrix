services:
  postgres:
    image: postgres:16-alpine
    container_name: matrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-matrix}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5423}:5432"
    volumes:
      - matrix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-matrix}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: matrix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: MATRIX
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:jhpNiYDHjs6UdixpxWYrQ1qaEW8R1yamqZ+vZ4iskkI=}
      APP_URL: https://matrixbmi.shop
      ASSET_URL: https://matrixbmi.shop
      SANCTUM_STATEFUL_DOMAINS: matrixbmi.shop
      SESSION_DOMAIN: matrixbmi.shop
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-matrix}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      FILESYSTEM_DISK: public
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_BACKUP_1: ${GEMINI_API_KEY_BACKUP_1:-}
      GEMINI_API_KEY_BACKUP_2: ${GEMINI_API_KEY_BACKUP_2:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_OCR_MODEL: ${GEMINI_OCR_MODEL:-gemini-3.7-flash}
    ports:
      - "8000:80"
    volumes:
      - matrix-storage:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:80
    container_name: matrix-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:80
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  matrix-pgdata:
    driver: local
  matrix-storage:
    driver: local

